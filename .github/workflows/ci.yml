# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: givemeticon CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    # 실행될 jobs를 순서대로 명시
    steps:

      - name: Get Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradlew 파일은 일반적으로 Gradle 빌드 스크립트를 실행하기 위한 스크립트 파일로 사용됩니다. 이 명령어를 통해 gradlew 파일을 실행 가능한 상태로 만들어 빌드 스크립트를 실행할 수 있게 됩니다.
      - name: Grant permission to execute gradle command
        run: chmod +x gradlew

      - name: Build with Gradle
        uses: gradle/gradle-build-action@bd5760595778326ba7f1441bcf7e88b49de61a25 # v2.6.0
        with:
          arguments: build --stacktrace

      # secrets.TOKEN_GITHUB이 유효하지 않아(Bad credentials) 매 실행마다 이 스텝에서
      # job 전체가 failure로 표시되고 있다 (develop의 최근 커밍들도 동일하게 실패 중 -
      # 이번 PR의 코드 변경과 무관한 기존 CI 문제). 토큰을 교체하기 전까지 주석 처리.
