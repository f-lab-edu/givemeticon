name: Issue 177 bounded hosted baseline
on:
  push:
    branches: [test/issue-177-hosted-baseline]
    paths: ['.github/workflows/hosted-baseline.yml', 'scripts/verifier-isolated/**', 'src/test/**', 'docs/experiments/HOSTED_BASELINE_ISSUE_177.md']
permissions:
  contents: read
concurrency:
  group: givemeticon-issue177-baseline
  cancel-in-progress: false
jobs:
  capability-and-10k:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Capability before build
        run: python3 scripts/verifier-isolated/hosted/linux-capability.py build/hosted-evidence/capability-initial.json
      - name: Secret-free config and full package tests
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx512m cleanTest test bootJar
          for test in scripts/verifier-isolated/test-*.py scripts/verifier-isolated/hosted/test-*.py; do python3 -B "$test"; done
          bash scripts/verifier-isolated/capped/test-memory-guard.sh
          bash scripts/verifier-isolated/capped/test-capped-runners.sh
          find scripts/verifier-isolated -name '*.sh' -exec bash -n {} \;
      - name: Capability, then sequential stock/V1 10k only
        run: bash scripts/verifier-isolated/hosted/run-hosted.sh
      - name: Preserve test evidence
        if: always()
        run: |
          mkdir -p build/hosted-evidence/tests
          cp build/test-results/test/TEST-*.xml build/hosted-evidence/tests/ 2>/dev/null || true
          git rev-parse HEAD > build/hosted-evidence/checked-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue177-${{ github.sha }}-${{ github.run_attempt }}
          path: build/hosted-evidence/
          retention-days: 7
          if-no-files-found: error
