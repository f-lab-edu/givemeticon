# Environment for `scripts/verify.sh load`: app and MySQL with pinned CPU limits, k6 runs on the host.
# Started and removed (down -v) by verify.sh; the manual-run docker-compose.yml is unrelated.
# redis (S3 decision counter) is up for every stage; S0/S1 do not use it. No persistence, 1 cpu.
# Required variables (set by verify.sh): COUPON_LAB_DB_PASSWORD, COUPON_STRATEGY, LOAD_GC_DIR.
# Optional (test C diagnostics, verify.sh load --pool / --flush-log): HIKARI_POOL_SIZE (default 10),
# FLUSH_LOG (default 1 = MySQL's own default). FLUSH_LOG=2 relaxes durability and is a diagnostic only.
services:
  mysql:
    image: mysql:8.0
    container_name: coupon-lab-load-mysql
    cpus: 2
    command: ["--innodb_flush_log_at_trx_commit=${FLUSH_LOG:-1}"]
    ports:
      - "13307:3306"
    environment:
      MYSQL_DATABASE: coupon_lab
      MYSQL_ROOT_PASSWORD: ${COUPON_LAB_DB_PASSWORD:?set COUPON_LAB_DB_PASSWORD}
    healthcheck:
      # -h 127.0.0.1 forces TCP, which only the real server answers (not the temporary init server).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: coupon-lab-load-redis
    cpus: 1
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: coupon-lab-load-app
    cpus: 2
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      COUPON_LAB_DB_URL: jdbc:mysql://mysql:3306/coupon_lab?useSSL=false&allowPublicKeyRetrieval=true
      COUPON_LAB_DB_USER: root
      COUPON_LAB_DB_PASSWORD: ${COUPON_LAB_DB_PASSWORD:?set COUPON_LAB_DB_PASSWORD}
      COUPON_LAB_REDIS_HOST: redis
      COUPON_LAB_REDIS_PORT: 6379
      COUPON_STRATEGY: ${COUPON_STRATEGY:?set COUPON_STRATEGY}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_POOL_SIZE:-10}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
    volumes:
      - ${LOAD_GC_DIR:?set LOAD_GC_DIR}:/var/log/app
    healthcheck:
      # bash /dev/tcp instead of curl: the JRE image is not guaranteed to ship curl.
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 3s
      timeout: 3s
      retries: 30
