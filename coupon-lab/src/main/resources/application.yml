coupon:
  strategy: s0

spring:
  datasource:
    url: ${COUPON_LAB_DB_URL}
    username: ${COUPON_LAB_DB_USER}
    password: ${COUPON_LAB_DB_PASSWORD}
  data:
    redis:
      host: ${COUPON_LAB_REDIS_HOST:localhost}
      port: ${COUPON_LAB_REDIS_PORT:6379}
  rabbitmq:
    host: ${COUPON_LAB_RABBIT_HOST:localhost}
    port: ${COUPON_LAB_RABBIT_PORT:5672}
    username: ${COUPON_LAB_RABBIT_USERNAME:guest}
    password: ${COUPON_LAB_RABBIT_PASSWORD:guest}
    publisher-confirm-type: simple
    publisher-returns: true
    # S4: up to 200 Tomcat threads publish at once. With the default cache of 25, every publisher beyond it opened and
    # closed its own channel per request (channel churn). 200 = server.tomcat.threads.max. No checkout-timeout, so it stays
    # a cache and never blocks a request waiting for a channel.
    cache:
      channel:
        size: 200
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        prefetch: 50

mybatis:
  mapper-locations: classpath:mapper/*.xml
