# Prometheus + Grafana for local observability (응답시간·커넥션·쿠폰 발급 지연 관찰).
#
# 전제: 앱은 컨테이너 밖에서 ./gradlew bootRun 으로 떠 있고(8080),
# management.endpoints.web.exposure.include로 /actuator/prometheus가 열려 있다
# (src/main/resources/application.yml). docker-compose.infra.yml(MySQL/Redis/Kafka)과는
# 독립적으로 필요할 때만 띄운다.
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#   open http://localhost:9090        # Prometheus
#   open http://localhost:3001        # Grafana (admin / admin) - "givemeticon overview" 대시보드 자동 프로비저닝
#   (호스트에 brew로 설치된 Grafana가 이미 3000번을 쓰고 있어 3001로 매핑했다)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: givemeticon-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - givemeticon-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: givemeticon-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - givemeticon-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  givemeticon-prometheus-data:
  givemeticon-grafana-data:
