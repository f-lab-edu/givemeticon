# Explicit opt-in only. Endpoints/credentials must name separately authorized isolated resources.
coupon:
  mq:
    event-id: ${COUPON_MQ_EVENT_ID}
    host: ${COUPON_MQ_HOST}
    port: ${COUPON_MQ_PORT}
    vhost: ${COUPON_MQ_VHOST}
    username: ${COUPON_MQ_USERNAME}
    password: ${COUPON_MQ_PASSWORD}
    management-url: ${COUPON_MQ_MANAGEMENT_URL}
  event-issuance:
    worker:
      enabled: true
